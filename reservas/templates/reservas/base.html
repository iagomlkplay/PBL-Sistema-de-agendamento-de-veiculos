<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}COSEG Agendamento{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'reservas/css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <h1>Sistema de Agendamento de Veículos</h1>
            <nav>
                {% if user.is_authenticated %}
                    <span style="color:#ffcc00;">👤 {{ user.username }}</span>
                    <a href="{% url 'index' %}">Início</a>
                    <a href="{% url 'nova_reserva_page' %}">Nova Reserva</a>
                    <a href="{% url 'lista_reservas_page' %}">Reservas</a>
                    <a href="/admin/" target="_blank">Admin</a>
                    <a href="{% url 'logout' %}">Sair</a>
                {% else %}
                    <a href="{% url 'login' %}">Entrar</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>COSEG - Porto do Itaqui</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
